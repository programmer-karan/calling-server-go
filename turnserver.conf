# Coturn TURN server configuration for production WebRTC.
#
# Replace YOUR_PUBLIC_IP with your server's actual public IP.
# Replace CHANGE_ME with a strong password.

# ── Networking ────────────────────────────────────────────────────────────────
listening-port=3478
# Uncomment for TLS TURN (port 5349):
# tls-listening-port=5349

# Your server's public IP address (REQUIRED).
external-ip=YOUR_PUBLIC_IP

# UDP relay port range — ensure these are open in your firewall.
min-port=49152
max-port=65535

# ── Authentication ────────────────────────────────────────────────────────────
# Long-term credentials (must match ICE_SERVERS in docker-compose).
lt-cred-mech
user=webrtcuser:CHANGE_ME

# Realm (use your domain or any string).
realm=calling.example.com

# ── Security ──────────────────────────────────────────────────────────────────
# Prevent relaying to private IP ranges (security best practice).
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# ── Logging ───────────────────────────────────────────────────────────────────
log-file=stdout
verbose
