# Nginx reverse proxy for HTTPS + WebSocket support.
# Replace YOUR_DOMAIN with your actual domain (e.g. call.example.com).
#
# SSL certs: use Let's Encrypt (certbot) to generate them:
#   certbot certonly --standalone -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── SSL ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── WebSocket: P2P signaling ──────────────────────────────────────────────
    location /ws {
        proxy_pass http://webrtc-server:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── WebSocket: SFU ────────────────────────────────────────────────────────
    location /ws/sfu {
        proxy_pass http://webrtc-server:8080/ws/sfu;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://webrtc-server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Frontend ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://webrtc-server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
