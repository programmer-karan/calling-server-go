services:
  webrtc-server:
    build: .
    container_name: webrtc-server
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # Optional: override ICE servers (JSON array).
      # Uncomment and fill in your TURN server details.
      # ICE_SERVERS: '[{"urls":["turn:YOUR_IP:3478"],"username":"webrtcuser","credential":"webrtcpass"}]'
      ICE_SERVERS: ""

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5